
{% extends "base_front.html" %}

{% block content %}
 <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.png" alt="">
                  <span class="d-none d-lg-block">NiceAdmin</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3">

                <div class="card-body">

                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Create an Account</h5>
                    <p class="text-center small">Enter your personal details to create account</p>
                  </div>

                  <form method="post" class="row g-3">
                        {% csrf_token %}

                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" name="first_name" class="form-control" id="firstName" required>
                        </div>

                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" name="last_name" class="form-control" id="lastName" required>
                        </div>

                        <div class="col-12">
                            <label for="employeeNo" class="form-label">Employee Number</label>
                            <input type="text" name="employee_no" class="form-control" id="employeeNo" required>
                        </div>

                        <div class="col-md-6">
                            <label for="yourEmail" class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" id="yourEmail" required>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" id="phone">
                        </div>

                        <div class="col-md-6">
                            <label for="role" class="form-label">Staff Role</label>
                            <select name="role" class="form-select" id="role" required>
                            <option value="" selected disabled>Select a role</option>
                            <option value="teacher">Teacher</option>
                            <option value="admin_staff">Admin Staff</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label">Department</label>
                            <input type="text" name="department" class="form-control" id="department">
                        </div>

                        <div class="col-md-6">
                            <label for="positionTitle" class="form-label">Position Title</label>
                            <input type="text" name="position_title" class="form-control" id="positionTitle">
                        </div>

                        <div class="col-md-6">
                            <label for="hireDate" class="form-label">Hire Date</label>
                            <input type="date" name="hire_date" class="form-control" id="hireDate">
                        </div>

                        <div class="col-12">
                            <label for="yourUsername" class="form-label">Username</label>
                            <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input type="text" name="username" class="form-control" id="yourUsername" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="yourPassword" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" id="yourPassword" minlength="8" required>
                        </div>

                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" id="confirmPassword" minlength="8" required>
                        </div>

                        <!-- Saved to TeacherDetail only when role is teacher -->
                        <div class="col-12 teacher-field d-none">
                            <label for="specialization" class="form-label">Specialization</label>
                            <input type="text" name="specialization" class="form-control" id="specialization">
                        </div>

                        <div class="col-md-6 teacher-field d-none">
                            <label for="licenseNumber" class="form-label">License Number</label>
                            <input type="text" name="license_number" class="form-control" id="licenseNumber">
                        </div>

                        <div class="col-md-6 teacher-field d-none">
                            <label for="advisoryClass" class="form-label">Advisory Class</label>
                            <input type="text" name="advisory_class" class="form-control" id="advisoryClass">
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                            <input class="form-check-input" name="terms" type="checkbox" id="acceptTerms" required>
                            <label class="form-check-label" for="acceptTerms">
                                I agree to the terms and conditions.
                            </label>
                            </div>
                        </div>

                        <div class="col-12">
                            <button class="btn btn-primary w-100" type="submit">Create Account</button>
                        </div>

                        <div class="col-12">
                            <p class="small mb-0">
                            Already have an account? <a href="{% url 'login' %}">Log in</a>
                            </p>
                        </div>
                        </form>

                        <script>
                        const roleSelect = document.getElementById("role");
                        const teacherFields = document.querySelectorAll(".teacher-field");

                        roleSelect.addEventListener("change", function () {
                            teacherFields.forEach(field => {
                            field.classList.toggle("d-none", this.value !== "teacher");
                            });
                        });
                        </script>



                </div>
              </div>

              <div class="credits">
                <!-- All the links in the footer should remain intact. -->
                <!-- You can delete the links only if you purchased the pro version. -->
                <!-- Licensing information: https://bootstrapmade.com/license/ -->
                <!-- Purchase the pro version with working PHP/AJAX contact form: https://bootstrapmade.com/nice-admin-bootstrap-admin-html-template/ -->
                Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a>
              </div>

            </div>
          </div>
        </div>

      </section>

    </div>
    {% endblock %}
